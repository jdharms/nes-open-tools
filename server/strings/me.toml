# The player's own page strings (me.html).
# Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[me.page_title]
note = "plain: browser tab title, the signed-in player's own page (/me); {name} their Discord display name"
text = "{name} - NES Open Randomizer"

[me.heading]
note = "h1 of the player's own page; {name} their Discord display name"
text = "{name}"

[me.entries.heading]
note = "h2 over the table of seeds the player has entered (downloaded while signed in); the player's rounds are a table of their own below (me.rounds.heading)"
text = "Downloaded Seeds"

[me.entries.seed]
note = "entries table column header; the seed's magic words, linking to its seed page"
text = "Seed Link"

[me.entries.par]
note = "entries table column header; the seed's total par"
text = "Total Par"

[me.entries.name]
note = "entries table column header; the player name chosen at the latest download, a new save's default"
text = "Player Name"

[me.entries.clubs]
note = "entries table column header; club labels chosen at the latest download, a new save's default bag, putter included"
text = "Club Bag"

[me.entries.entered]
note = "entries table column header; when the player first downloaded the seed signed in, shown in the viewer's local time"
text = "Downloaded"

[me.entries.none]
note = "shown instead of the entries table when the player has entered no seeds; entering is downloading a seed while signed in; may link to /generate"
text = """
You haven't downloaded any seeds yet! Once you do, this page will show
a list of the seeds you've downloaded and played."""

[me.rounds.heading]
note = "h2 over the table of rounds the player has submitted by scanning the end-of-round QR code, newest first"
text = "Completed Rounds"

[me.rounds.seed]
note = "rounds table column header; the seed's magic words, linking to its seed page, followed by an asterisk when the round was played as player 2"
text = "Seed Link"

[me.rounds.par]
note = "rounds table column header; the seed's total par"
text = "Par"

[me.rounds.strokes]
note = "rounds table column header; total strokes for the round"
text = "Total Strokes"

[me.rounds.putts]
note = "rounds table column header; total putts for the round"
text = "Putts"

[me.rounds.received]
note = "rounds table column header; when the scan was recorded, shown in the viewer's local time"
text = "Submitted"

[me.rounds.flagged]
note = "marker after one of the player's rounds' total strokes when an admin has flagged it: the round is being questioned but still counts; short, fits in a table cell"
text = "(Under review)"

[me.rounds.none]
note = "shown instead of the rounds table when the player has submitted no rounds; a round is submitted by scanning the QR code shown after the scorecard with a phone"
text = "After you've completed a round and submitted the scorecard, this will be a table listing all your completed rounds."

[me.download_settings.heading]
note = "h2 over the player's saved download settings"
text = "Download Settings"

[me.download_settings.lead]
note = "line at the top of the saved settings; every seed's download form starts from these, fitted to that seed's club rules; a download saves what it used, except the bag from a seed with club rules; kept on the account and in this browser"
text = "This form lets you set defaults for the settings that get filled in when downloading a seed."

[me.download_settings.clubs_help]
note = "small line under the club checkboxes; any bag of up to 14 clubs, putter included and always carried; a seed's rules may take clubs out"
text = "Set your preferred bag of clubs here.  Seeds with club restrictions may remove clubs from your bag, and you might want to adjust for those seeds."

[me.download_settings.save]
note = "plain: submit button; saves these settings"
text = "Save Settings"

[me.download_settings.forget_help]
note = "small line above the forget button; deletes the saved settings from the account and this browser, so seed pages start from the unmodified game's settings; another browser keeps its own copy until its next download"
text = "You can use the \"Forget\" button to return all settings to their default values."

[me.download_settings.forget]
note = "plain: button; deletes the saved settings"
text = "Forget Settings"

[me.download_settings.result.saved]
note = "notice after saving the settings"
text = "Saved!"

[me.download_settings.result.forgotten]
note = "notice after forgetting the settings"
text = "Download Settings returned to default values"

[me.download_settings.result.invalid_name]
note = "notice, not saved: the name can't be stored; empty, over 10 characters, or characters outside A-Z, '.' and space"
text = "Settings not saved: check that the name is valid.  It can't be empty, over 10 characters, or contain any characters that aren't capital letters, spaces or periods."

[me.download_settings.result.clubs_over_max]
note = "notice, not saved: more than 14 clubs with the putter"
text = "Settings not saved: Too many clubs selected. (Select at most 13 non-putter clubs.)"

[me.download_settings.result.invalid]
note = "notice, not saved: a value the form can't produce"
text = "Settings not saved: Something went wrong, refresh and try again."
