# Round page strings (round.html): a recorded round at its `/r/<id>` permalink. Reached
# by the redirect from a scan of the end-of-round QR code, and by links from the seed page,
# /me and a shared URL. Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[round.page_title]
note = "plain: browser tab title, a recorded round's page; {words} the seed's three magic words"
text = "Completed Round - NES Open Randomizer"

# The round page's link preview card, which a chat such as Discord draws under a pasted
# link. It never receives the score: the card shows to players who have yet to play the seed.

[round.card.title]
note = "plain: title of a round page's link preview card; {words} the seed's three magic words"
text = "{words}"

[round.card.player_one]
note = "plain: body of a round page's link preview card, round played as player 1; {name} the player's Discord display name"
text = "{name}'s scorecard"

[round.card.player_two]
note = "plain: body of a round page's link preview card, round played as player 2 on the player's ROM; {name} the ROM owner's Discord display name"
text = "{name}'s scorecard"

[round.heading_recorded]
note = "h1, shown only when the visitor arrived from the scan that just recorded this round; every other way in shows round.heading"
text = "Round successfully recorded!"

[round.heading]
note = "h1, the default heading for the round's permalink: a rescan (which changes nothing, the round shown being the one recorded first), a link from the seed page or /me, a shared URL, or a reload"
text = "Completed Round"

[round.player_one]
note = "line under the h1, round played as player 1; {name} the player's Discord display name, {received} when it was recorded, shown in the viewer's local time"
text = "{name} | {received}"

[round.player_two]
note = "line under the h1, round played as player 2 on the player's ROM, counted toward their entry; {name} the ROM owner's Discord display name, {received} when it was recorded, shown in the viewer's local time"
text = "teammate | {received}"

[round.seed]
note = "label before the link to the seed page, which shows the seed's magic words"
text = "Seed permalink:"

[round.holes.number]
note = "round table column header; hole number 1-18"
text = "Hole"

[round.holes.par]
note = "round table column header; the hole's par"
text = "Par"

[round.holes.strokes]
note = "round table column header; strokes on the hole, putts included"
text = "Total Strokes"

[round.holes.putts]
note = "round table column header; putts on the hole"
text = "Putts"

[round.holes.front_total]
note = "round table footer label under the front nine; its total par, strokes and putts follow"
text = "Out"

[round.holes.back_total]
note = "round table footer label under the back nine; its total par, strokes and putts follow"
text = "In"

[round.holes.total]
note = "round table last footer row label, under the back nine's totals; all 18 holes' total par, strokes and putts follow"
text = "Total"

[round.holes.fairway]
note = "round table column header; whether the tee shot found the fairway (or the green) on a par 4 or 5. Only on rounds from ROMs that record it; par 3 cells stay empty"
text = "FIR"

[round.holes.fairway_hit]
note = "round table cell under round.holes.fairway: the tee shot found the fairway or the green, or went in"
text = "✓"

[round.holes.fairway_missed]
note = "round table cell under round.holes.fairway: the tee shot missed"
text = "✗"

[round.holes.fairways_count]
note = "round table footer cell under round.holes.fairway, for a nine and for the round; {hit} fairways hit, {possible} the par 4s and 5s"
text = "{hit}/{possible}"

[round.penalty_strokes]
note = "line under the round tables; {count} the round's penalty strokes, one each for a ball in the water or out of bounds (0 included). Only on rounds from ROMs that record it"
text = "Penalty Strokes: {count}"
