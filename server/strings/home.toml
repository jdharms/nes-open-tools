# Home page strings (home.html).
# Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[home.heading]
note = "home page h1"
text = "NES Open Tournament Golf Randomizer"

[home.tagline]
note = "line under the h1; what the site is"
text = """Play a new 18 holes every time you step onto the course."""

[home.about]
note = "what a seed is (18 holes, par layout, course music, wind); same holes and wind for everyone on a seed"
text = "Inspired by other randomizer projects like The ALTTP Randomizer, Super Mario World Randomizer, and The Legend of Zelda Randomizer, this site allows you to patch your copy of NES Open Tournament Golf with a course made up of a random selection of 18 holes from both the U.S. and Japanese (Mario Open Golf) releases of the game."

[home.step_rom.header]
note = "card 1 of 4, header; set up ROMs"
text = "Get the ROM."

[home.step_rom.body]
note = "card 1 of 4, body; set up ROMs, link /rom; files stay in the browser, only checked for being unmodified"
text = """You'll need a copy of the NES Open Tournament Golf (US)
ROM, and preferably a copy of the Mario Open Golf (Japan) ROM. Currently only
version 1.0 of Mario Open Golf is supported. Verify your ROMs at <a href="/rom">ROM Setup</a>.
Your ROM files never leave your machine."""

[home.step_generate.header]
note = "card 2 of 4, header; generate a seed"
text = "Generate a randomized game."

[home.step_generate.body]
note = "card 2 of 4, body; generate a seed, link /generate; share the seed page"
text = """Head on over to
<a href="/generate">Generate Game</a>. This screen shows a variety of options. When you're
satisfied, hit the Randomize! button and it'll take you to the "seed page"."""

[home.step_play.header]
note = "card 3 of 4, header; play"
text = "Get playing!"

[home.step_play.body]
note = "card 3 of 4, body; save the ROM from the seed page; a shared seed link gives the same course; what to play it on"
text = """From the seed page, you can save the patched ROM file.
Sending the link to a friend will let them save the same course. You'll need
something to run your game on.  An emulator (like <a href="https://www.mesen.ca/">Mesen</a>) is
a good choice. You can also play on original hardware using flash carts."""

[home.step_score.header]
note = "card 4 of 4, header; post your score"
text = "Submit your score."

[home.step_score.body]
note = "card 4 of 4, body; sign in before saving the ROM, guest ROMs show no code; finish all 18 holes; scan the QR code after the final scorecard with a phone; the round appears on the seed page and /me; optionally what's planned (stats, leaderboards)"
text = """
If you <a href="/auth/login">sign in</a> before saving your ROM, the game will display
a QR code at the end of the round. Scanning this code with your
phone will submit your scorecard, and your completed round
will show up on the seed page and on your account page.
Stats, analytics, and leaderboards are coming soon!
"""
